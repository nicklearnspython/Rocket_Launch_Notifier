[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spacex-launch-watcher"
version = "0.1.0"
description = "Personal SpaceX launch watcher configuration and command entrypoint."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "nicklearnspython" },
]

[project.scripts]
spacex-launch-watcher = "spacex_launch_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
